<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
      <rect width="10" height="40" fill="#ef4444" opacity="0.85"/>
      <rect x="10" width="10" height="40" fill="#f8fafc" opacity="0.9"/>
      <rect x="20" width="10" height="40" fill="#3b82f6" opacity="0.85"/>
      <rect x="30" width="10" height="40" fill="#f8fafc" opacity="0.9"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Subtle vintage wallpaper lines -->
  <g stroke="#f59e0b" stroke-opacity="0.08" stroke-width="2">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="560" y1="0" x2="560" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
  </g>
  <!-- Glow circles -->
  <circle cx="650" cy="200" r="190" fill="#f59e0b" opacity="0.12"/>
  <circle cx="520" cy="110" r="110" fill="#3b82f6" opacity="0.1"/>
  <!-- Barber Pole -->
  <g transform="translate(640, 55)">
    <rect x="12" y="35" width="56" height="210" rx="28" fill="url(#stripes)" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="4" y="25" width="72" height="18" rx="9" fill="url(#gold)"/>
    <rect x="4" y="240" width="72" height="18" rx="9" fill="url(#gold)"/>
    <path d="M16 25 A24 24 0 0 1 64 25 Z" fill="#e2e8f0"/>
    <path d="M16 258 A24 24 0 0 0 64 258 Z" fill="#e2e8f0"/>
    <rect x="18" y="35" width="12" height="210" fill="#ffffff" opacity="0.25"/>
  </g>
  <!-- Scissors & Comb Illustration -->
  <g transform="translate(450, 95) rotate(-18)" stroke="url(#gold)" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="20" y1="180" x2="140" y2="30"/>
    <line x1="140" y1="180" x2="20" y2="30"/>
    <circle cx="25" cy="195" r="22" stroke-width="6"/>
    <circle cx="135" cy="195" r="22" stroke-width="6"/>
    <circle cx="80" cy="105" r="6" fill="#f59e0b"/>
  </g>
  <!-- Comb -->
  <g transform="translate(350, 210) rotate(-35)" fill="#f59e0b" opacity="0.35">
    <rect x="0" y="0" width="150" height="16" rx="6"/>
    <rect x="8" y="16" width="5" height="28" rx="2"/>
    <rect x="20" y="16" width="5" height="28" rx="2"/>
    <rect x="32" y="16" width="5" height="28" rx="2"/>
    <rect x="44" y="16" width="5" height="28" rx="2"/>
    <rect x="56" y="16" width="5" height="28" rx="2"/>
    <rect x="68" y="16" width="5" height="28" rx="2"/>
    <rect x="80" y="16" width="5" height="28" rx="2"/>
    <rect x="92" y="16" width="5" height="28" rx="2"/>
    <rect x="104" y="16" width="5" height="28" rx="2"/>
    <rect x="116" y="16" width="5" height="28" rx="2"/>
    <rect x="128" y="16" width="5" height="28" rx="2"/>
    <rect x="140" y="16" width="5" height="28" rx="2"/>
  </g>
  <!-- Mustache badge accent -->
  <path d="M510 310 C490 295, 465 305, 455 320 C475 325, 495 320, 510 315 C525 320, 545 325, 565 320 C555 305, 530 295, 510 310 Z" fill="#f59e0b" opacity="0.45"/>
</svg>

