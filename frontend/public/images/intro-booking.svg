<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="640" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="50%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="190" y1="40" x2="440" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Soft backdrop -->
  <rect width="640" height="460" rx="28" fill="url(#bgGlow)"/>
  <circle cx="110" cy="95" r="76" fill="#DBEAFE" opacity="0.7"/>
  <circle cx="535" cy="360" r="88" fill="#D1FAE5" opacity="0.65"/>
  <circle cx="515" cy="95" r="52" fill="#EDE9FE" opacity="0.8"/>

  <!-- Subtle cloud shapes -->
  <path d="M72 340c0-18 15-32 33-32 4-22 23-38 46-38 26 0 47 21 47 47 14 2 24 14 24 28 0 16-13 28-29 28H99c-15 0-27-14-27-33z" fill="#FFFFFF" opacity="0.85"/>
  <path d="M446 154c0-14 11-25 25-25 4-17 18-29 36-29 20 0 36 16 36 36 11 2 19 11 19 22 0 12-10 22-22 22h-72c-12 0-22-11-22-26z" fill="#FFFFFF" opacity="0.8"/>

  <!-- Central Phone Mockup -->
  <g filter="url(#softShadow)">
    <rect x="195" y="42" width="246" height="376" rx="34" fill="#0F172A"/>
    <rect x="205" y="52" width="226" height="356" rx="26" fill="#FFFFFF"/>
    <!-- Speaker notch -->
    <rect x="282" y="62" width="72" height="10" rx="5" fill="#E2E8F0"/>

    <!-- Header inside phone -->
    <rect x="219" y="84" width="198" height="72" rx="16" fill="url(#phoneGrad)"/>
    <text x="235" y="110" fill="#BFDBFE" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BOOKINGCLOUD UMKM</text>
    <text x="235" y="132" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Pilih Jadwal Layanan</text>
    <circle cx="392" cy="120" r="14" fill="#FFFFFF" opacity="0.2"/>
    <path d="M386 120l4 4 8-8" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Service card inside phone -->
    <rect x="219" y="168" width="198" height="58" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="245" cy="197" r="16" fill="#DBEAFE"/>
    <path d="M239 197h12M245 191v12" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <text x="270" y="192" fill="#0F172A" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Potong &amp; Styling</text>
    <text x="270" y="210" fill="#64748B" font-family="system-ui, sans-serif" font-size="11">30 menit · Rp 50.000</text>

    <!-- Slots grid inside phone -->
    <text x="222" y="246" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Jam Tersedia (WIB)</text>
    <rect x="219" y="256" width="60" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="249" y="275" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="700">09:30</text>

    <rect x="288" y="256" width="60" height="30" rx="8" fill="#2563EB"/>
    <text x="318" y="275" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">10:00</text>

    <rect x="357" y="256" width="60" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="387" y="275" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="700">10:30</text>

    <rect x="219" y="294" width="60" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="249" y="313" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="700">11:00</text>

    <rect x="288" y="294" width="60" height="30" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="318" y="313" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="700">13:30</text>

    <rect x="357" y="294" width="60" height="30" rx="8" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="387" y="313" text-anchor="middle" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="700">14:00</text>

    <!-- Bottom CTA button inside phone -->
    <rect x="219" y="340" width="198" height="44" rx="12" fill="url(#cardGrad)"/>
    <text x="318" y="367" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Konfirmasi Booking ✓</text>
  </g>

  <!-- Left Floating Shopfront / Calendar Illustration Card -->
  <g filter="url(#softShadow)">
    <rect x="34" y="138" width="144" height="122" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <!-- Awning -->
    <path d="M52 164h108l6 18H46l6-18z" fill="#EF4444"/>
    <path d="M70 164h18l2 18H68l2-18zM106 164h18l2 18h-22l2-18z" fill="#FFFFFF" opacity="0.9"/>
    <rect x="54" y="182" width="104" height="50" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
    <rect x="66" y="194" width="38" height="24" rx="4" fill="#DBEAFE"/>
    <rect x="114" y="194" width="32" height="38" rx="4" fill="#3B82F6"/>
    <text x="106" y="248" text-anchor="middle" fill="#1E293B" font-family="system-ui, sans-serif" font-size="11" font-weight="700">UMKM Terpercaya</text>
  </g>

  <!-- Right Floating Loyalty Voucher Card -->
  <g filter="url(#softShadow)">
    <rect x="462" y="205" width="148" height="104" rx="18" fill="#FFFFFF" stroke="#FDE68A"/>
    <circle cx="492" cy="236" r="16" fill="url(#goldGrad)"/>
    <text x="492" y="241" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="900">P</text>
    <text x="516" y="233" fill="#0F172A" font-family="system-ui, sans-serif" font-size="12" font-weight="800">+50 Poin</text>
    <text x="516" y="248" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Reward Selesai</text>
    <rect x="476" y="264" width="120" height="30" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-dasharray="4 3"/>
    <text x="536" y="283" text-anchor="middle" fill="#92400E" font-family="system-ui, sans-serif" font-size="11" font-weight="800">DISKON Rp 10.000</text>
  </g>

  <!-- Decorative sparkles -->
  <path d="M158 84l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z" fill="#3B82F6" opacity="0.75"/>
  <path d="M490 90l3 8 8 3-8 3-3 8-3-8-8-3 8-3 3-8z" fill="#10B981" opacity="0.8"/>
  <path d="M126 378l3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7z" fill="#F59E0B" opacity="0.8"/>
</svg>

