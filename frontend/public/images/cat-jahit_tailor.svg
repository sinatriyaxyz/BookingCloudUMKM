<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="55%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <circle cx="620" cy="200" r="180" fill="#e9d5ff" opacity="0.14"/>
  <!-- Dashed stitch curve -->
  <path d="M360 300 C430 220, 490 290, 560 220" stroke="#fde047" stroke-width="4" stroke-dasharray="12 10" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Thread Spool -->
  <g transform="translate(560, 105)">
    <rect x="20" y="25" width="90" height="145" rx="8" fill="#f472b6" opacity="0.9"/>
    <g stroke="#fbcfe8" stroke-width="3" opacity="0.6">
      <line x1="20" y1="50" x2="110" y2="62"/>
      <line x1="20" y1="75" x2="110" y2="87"/>
      <line x1="20" y1="100" x2="110" y2="112"/>
      <line x1="20" y1="125" x2="110" y2="137"/>
    </g>
    <rect x="8" y="10" width="114" height="22" rx="8" fill="#fde68a"/>
    <rect x="8" y="162" width="114" height="22" rx="8" fill="#fde68a"/>
  </g>
  <!-- Needle -->
  <g transform="translate(685, 80) rotate(24)">
    <rect x="0" y="0" width="10" height="185" rx="5" fill="#f8fafc"/>
    <ellipse cx="5" cy="22" rx="2.5" ry="10" fill="#6b21a8"/>
  </g>
</svg>

