      <stop offset="0%" stop-color="#831843"/>
      <stop offset="50%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
