  <!-- Cute smaller paw -->
  <g transform="translate(425, 225) scale(0.45) rotate(-18)" fill="#fde68a" opacity="0.45">
    <ellipse cx="90" cy="135" rx="52" ry="42"/>
    <ellipse cx="30" cy="70" rx="20" ry="26"/>
    <ellipse cx="70" cy="36" rx="19" ry="26"/>
