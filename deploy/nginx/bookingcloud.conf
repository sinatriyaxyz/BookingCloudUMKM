# Konfigurasi Nginx untuk BookingCloud UMKM
# Salin ke: /etc/nginx/sites-available/bookingcloud
# Aktifkan: sudo ln -sf /etc/nginx/sites-available/bookingcloud /etc/nginx/sites-enabled/bookingcloud
# Ganti DOMAIN_ANDA (mis. bookingcloud.example.id) sesuai domain atau IP server Anda.

server {
    listen 80;
    listen [::]:80;

    # Placeholder domain (ganti sesuai domain/IP VPS, '_' menerima request via IP/host apa pun sebagai fallback)
    server_name bookingcloud.example.id www.bookingcloud.example.id _;

    # Direktori hasil build statis frontend React (Vite)
    root /var/www/bookingcloud;
    index index.html;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Reverse proxy API ke container backend Express (port 3000 lokal)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache agresif untuk aset statis hasil bundle Vite (memiliki hash di nama file)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fallback Single Page Application (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

